# Audiobook backend on the Azure VM (SPEC §14, D28): the API container behind Caddy (HTTPS).
# Run from this folder: docker compose up -d   (deploy.sh does build + up + health check)
name: audiobook

services:
  api:
    build:
      context: ../backend
      args:
        INCLUDE_PIPER: ${INCLUDE_PIPER:-false}
    image: audiobook-api:latest
    env_file: .env
    environment:
      STORAGE_DIR: /app/storage
    volumes:
      - jobs:/app/storage
    # Not published on the host: only Caddy (same Docker network) reaches port 8000.
    expose:
      - "8000"
    restart: unless-stopped
    mem_limit: 900m
    memswap_limit: 900m # no swap for the container: the limit is real
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep this volume, Let's Encrypt rate-limits re-issuing
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jobs:
  caddy_data:
  caddy_config:
